name: QA
on:
  push:
    branches:
      - master
      - 'releases/**'
    tags:
      - '*'
    paths-ignore:
      - '**.md'
      - 'Docs/**'
      - 'website/**'
      - 'LICENSE'
  pull_request: ~
  workflow_dispatch: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  style:
    name: 🎨 Code Style
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Check code style
        run: |
          base=$(git merge-base origin/master HEAD)
          out=$(git clang-format-18 --diff --extensions c,cpp,h,hpp "$base" -- Source ':!Source/ThirdParty' || true)
          if [ -z "$out" ] || [ "$out" = "no modified files to format" ] || [ "$out" = "clang-format did not modify any files" ]; then
            echo "No formatting changes required"
            exit 0
          fi
          echo "$out"
          exit 1

  lint:
    name: 🔍 Clang-Tidy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: false  # Disable linting for now
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: qa-lint-${{ github.sha }}
          restore-keys: qa-lint-

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache clang clang-tidy pkg-config \
            libgl1-mesa-dev libglew-dev \
            libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxrandr-dev libxrender-dev libxss-dev libxxf86vm-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            libasound2-dev libpulse-dev \
            libibus-1.0-dev \
            libdbus-1-dev libreadline6-dev libssl-dev libudev-dev uuid-dev

      - name: CMake
        run: |
          export CC=clang
          export CXX=clang++
          cmake -S . -B build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DURHO3D_LIB_TYPE=shared \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: |
          # Get changed C/C++ files (excluding ThirdParty)
          base=$(git merge-base origin/master HEAD)
          changed_files=$(git diff --name-only $base HEAD -- Source | grep -v ThirdParty | grep -E '\.(c|cpp|h|hpp)$' || true)
          if [ -n "$changed_files" ]; then
            echo "Linting files:"
            echo "$changed_files"
            echo "$changed_files" | xargs clang-tidy -p build 2>&1 | tee build/clang-tidy.out
          else
            echo "No C/C++ source files changed"
          fi

  tests:
    name: 🧪 Unit Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-2022", "macos-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: qa-tests-${{ github.sha }}
          restore-keys: qa-tests-

      - name: Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache ninja-build pkg-config \
            libgl1-mesa-dev libglew-dev \
            libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxrandr-dev libxrender-dev libxss-dev libxxf86vm-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            libasound2-dev libpulse-dev \
            libibus-1.0-dev \
            libdbus-1-dev libreadline6-dev libssl-dev libudev-dev uuid-dev

      - name: CMake
        shell: bash
        env:
          EXTRA_FLAGS: ${{ runner.os == 'Linux' && '-G Ninja -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache' || '' }}
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DURHO3D_UNIT_TESTS=ON \
            -DURHO3D_SAMPLES=OFF \
            -DURHO3D_TOOLS=OFF \
            -DURHO3D_PLAYER=OFF \
            -DURHO3D_ANGELSCRIPT=OFF \
            -DURHO3D_LUA=OFF \
            -DURHO3D_LUAJIT=OFF \
            -DURHO3D_DEPLOYMENT_TARGET=generic \
            $EXTRA_FLAGS

      - name: Build
        shell: bash
        run: cmake --build build --target Urho3D-UnitTests --parallel 4 --config Debug

      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure --parallel 2 -C Debug

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log-${{ matrix.os }}
          path: build/Testing/Temporary/LastTest.log
          retention-days: 7
